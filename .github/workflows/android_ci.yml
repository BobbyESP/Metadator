name: Android CI

on:
  pull_request:
    branches: [ "master", "v2" ]
  push:
    branches: [ "v2" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, tests and debug build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Unit tests
        run: ./gradlew test

      - name: Build the FOSS debug APK
        run: ./gradlew :app:assembleFossDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: metadator-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk

  release:
    name: Signed release APKs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          base64 -d <<< "$ENCODED_KEYSTORE" > "$RUNNER_TEMP/keystore.jks"
          echo "SIGNING_KEY_STORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew :app:assembleFossRelease :app:assemblePlaystoreRelease

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: metadator-release
          path: app/build/outputs/apk/**/release/*.apk
