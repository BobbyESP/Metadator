name: Release

# Builds the signed release APKs of the chosen branch or tag and keeps them as an artifact.
# Needs the secrets SIGNING_KEY_STORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and
# SIGNING_KEY_PASSWORD, and optionally GOOGLE_SERVICES_JSON_BASE64 for the playstore flavor.
on:
  workflow_dispatch:

permissions:
  contents: read

# Not named after the workflow: the checks it calls take that group, and would wait on this one.
concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Signed release APKs
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      # Without a keystore the build succeeds and leaves unsigned APKs: stop before that.
      - name: Check the signing secrets
        run: |
          missing=0
          for name in SIGNING_KEY_STORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release never writes the cache the checks read.
      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: 'true'

      - name: Decode the keystore
        run: |
          base64 -d <<< "$SIGNING_KEY_STORE_BASE64" > "$RUNNER_TEMP/keystore.jks"
          echo "SIGNING_KEY_STORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      # Firebase is only applied when this file exists (see app/build.gradle.kts).
      - name: Add the Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            base64 -d <<< "$GOOGLE_SERVICES_JSON_BASE64" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set: the playstore APK is built without Crashlytics."
          fi

      - name: Build
        run: ./gradlew :app:assembleFossRelease :app:assemblePlaystoreRelease

      - name: Check that the APKs are signed
        run: |
          unsigned=$(find app/build/outputs/apk -name '*-unsigned.apk')
          if [ -n "$unsigned" ]; then
            echo "::error::Unsigned APKs: $unsigned"
            exit 1
          fi

      - name: Upload the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadator-release
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
